<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar - MyDiary</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../sidebar/navigation.css" />
    <script src="../sidebar/navigation.js" defer></script>
  </head>
  <body data-page="calendar">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>
    <section id="authScreen">
      <div class="auth-container">
        <div class="auth-card glass">
          <div class="auth-logo">˚˖𓍢ִ໋🌷͙֒✧˚.🎀༘⋆</div>
          <h1>MyDiary</h1>
          <p class="auth-subtitle">Your Personal Memory Journal</p>
          <form id="loginForm">
            <div class="input-group">
              <label>Password</label>
              <input type="password" id="loginPassword" placeholder="Enter your diary password" />
            </div>
            <div class="remember-row">
              <label class="remember-label"><input type="checkbox" id="rememberMe" /> Remember Me</label>
            </div>
            <button type="submit" class="primary-btn auth-btn">Unlock Journal</button>
          </form>
          <div class="first-time-setup">
            <p>First time here?</p>
            <button id="createPasswordBtn" class="secondary-btn">Create Password</button>
          </div>
        </div>
      </div>
    </section>
    <div id="appShell" hidden>
      <main class="main-content">
        <section id="calendarWorkspace" class="glass dashboard-section workspace">
          <div class="section-header">
            <h2>🗓️ Memory Calendar</h2>
            <div class="calendar-controls">
              <button id="prevMonthBtn">â†</button>
              <h3 id="calendarMonth">June 2026</h3>
              <button id="nextMonthBtn">â†’</button>
            </div>
          </div>
          <div id="calendarGrid"></div>
        </section>
      </main>
    </div>
    <div id="memoryModal" class="modal"><div class="modal-content glass"><button id="closeModal">âœ•</button><div id="modalBody"></div></div></div>
    <div id="toastContainer"></div>
    <script src="../script.js"></script>
    <script src="../modules/calendar.js"></script>
  </body>
</html>
