<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study - MyDiary</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../sidebar/navigation.css" />
    <link rel="stylesheet" href="../styles/study-notes.css" />
    <script src="../sidebar/navigation.js" defer></script>
  </head>
  <body data-page="diary" data-journal="study">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <section id="authScreen">
      <div class="auth-container">
        <div class="auth-card glass">
          <div class="auth-logo">˚˖𓍢ִ໋🌷͙֒✧˚.🎀༘⋆</div>
          <h1>MyDiary</h1>
          <p class="auth-subtitle">Your Personal Memory Journal</p>
          <form id="loginForm">
            <div class="input-group">
              <label>Password</label>
              <input type="password" id="loginPassword" placeholder="Enter your diary password" />
            </div>
            <div class="remember-row">
              <label class="remember-label"><input type="checkbox" id="rememberMe" /> Remember Me</label>
            </div>
            <button type="submit" class="primary-btn auth-btn">Unlock Journal</button>
          </form>
          <div class="first-time-setup">
            <p>First time here?</p>
            <button id="createPasswordBtn" class="secondary-btn">Create Password</button>
          </div>
        </div>
      </div>
    </section>

    <div id="appShell" hidden>
    
      <main class="main-content">
        <section id="studyWorkspace" class="workspace">
          <div class="workspace-hero study-theme">
            <h1>📚 Study Journal</h1>
          </div>

          <section class="glass dashboard-notes-section" data-journal-notes="study">
            <div class="section-header">
              <h2>☕︎ Study Notes</h2>
              <span class="muted">Save study notes & keep history</span>
            </div>

            <div class="journal-note-composer">
              <input type="text" class="journal-note-title" placeholder="Note title..." />
              <textarea class="journal-note-content" rows="4" placeholder="Write your note..."></textarea>
              <div class="journal-note-actions">
                <button type="button" class="primary-btn journal-note-save">Save Note</button>
                <button type="button" class="secondary-btn journal-note-clear">Clear</button>
              </div>
            </div>

            <div class="journal-notes-history">
              <div class="section-header">
                <h2>Memory Feed</h2>
                <input type="text" class="journal-note-search" placeholder="Search notes..." />
              </div>
              <div class="journal-notes-feed" aria-live="polite"></div>
              <div class="journal-notes-empty" hidden>
                <h3>😶‍🌫 No study notes yet</h3>
                <p>Write your first note above.</p>
              </div>
            </div>
          </section>

          <div class="workspace-placeholder glass">
            Subjects Flashcards Study Progress Revision Planner Interview Prep
          </div>
        </section>
      </main>
    </div>

    <div id="memoryModal" class="modal"><div class="modal-content glass"><button id="closeModal">✕</button><div id="modalBody"></div></div></div>
    <div id="toastContainer"></div>
    <script src="../script.js"></script>
    <script src="../modules/journal-notes.js"></script>
  </body>
</html>
